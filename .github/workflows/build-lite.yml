name: Build Cherry Lite (macOS)

# 默认本地打包（pnpm build:mac:arm64）。需要云端产物时再手动跑本 workflow。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.0.13-lite)'
        required: false
        default: 'v2.0.13-lite'
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS ARM64 / Intel DMG
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup macOS dependencies
        run: |
          brew install python-setuptools || true

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build macOS Application (arm64 & x64)
        run: |
          sudo -H pip install setuptools || true
          pnpm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=8192
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage build artifacts
        id: stage
        shell: bash
        run: |
          mkdir -p release-dist
          cp dist/*.dmg dist/*.zip dist/*.blockmap release-dist/ 2>/dev/null || true
          ls -lh release-dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cherry-lite-macos
          path: release-dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Cherry Lite ${{ inputs.release_tag || github.ref_name }}
          body: |
            ## Cherry Studio Lite - 私人专属定制版

            🚀 **构建产物特性**：
            - 基于当前 `cherry-lite` 定制分支自动化编译
            - 适配 macOS Apple Silicon (arm64) 与 Intel (x64)
            - 修复 macOS Dock 图标单击秒弹问题 (#19588)
            - 修复视口自动滚动置底 (Codex Follow 机制)
            - 彻底摘除 (0,0) 幽灵气泡 (全域无残留)
            - 内置原生任务完成与权限审批提示音
            - 搭载高保真 Telegram 原生 HTML 渲染引擎
          files: |
            release-dist/*.dmg
            release-dist/*.zip
            release-dist/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
